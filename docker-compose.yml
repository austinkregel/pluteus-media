services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The job queue, on its own server rather than in its own database beside the
  # catalogue. Oban polls: it fetches, it elects a leader, it prunes, and it does so
  # whether or not anything is happening. Sharing a server means sharing a connection
  # pool, shared buffers, autovacuum and CPU with the thing a person is waiting for,
  # and it means the catalogue's log is mostly the queue talking to itself.
  #
  # Nothing here is backed up or published. The queue is operational state the schedule
  # rebuilds, which spec-04 §3 makes true by giving every stage its own way of finding
  # what it is due to do.
  jobs-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - jobsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # spec-05 §5.5's corpora: published data the household holds a copy of so that a lookup
  # tells nobody it was made. On a server of its own because a corpus is large and imported
  # in bulk — MusicBrainz alone is tens of gigabytes — and an import on the catalogue's
  # server would take its buffers and its disk from the request a person is waiting on.
  #
  # Not published and not backed up: every corpus is the publisher's, refetched after loss
  # (spec-05 §5.7).
  corpus-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - corpusdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # The node refuses to start when a volume holding the household's bytes is not
    # mounted, and a volume that is merely late is the ordinary case after a power cut.
    # Docker backs off between restarts of its own accord, up to a minute, so a store
    # that comes back some minutes after this host does is waited out rather than
    # needing a hand.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      jobs-db:
        condition: service_healthy
      corpus-db:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    # Host 4100 because 4000 is held by homelab-iab. The container still
    # serves on Phoenix's default 4000 internally.
    ports:
      - "4100:4000"
    # Chromium's renderer puts its shared buffers in /dev/shm, and Docker gives a
    # container 64MB of it, which a page of any size exhausts — the tab dies rather than
    # reporting a limit. The alternative flag writes those buffers to disk instead, which
    # is slower and makes the cause look like something about the page.
    shm_size: 1gb
    volumes:
      - .:/app
      # deps and _build are named volumes rather than bind mounts: artifacts
      # compiled against the host's OTP and library paths are not valid inside
      # the image, and sharing one directory between the two corrupts both.
      - deps:/app/deps
      - build:/app/_build
      # The demo corpus, read-only. Acquisition moves what it takes out of the
      # inbox (spec-04 §4.3), so the inbox is never pointed at a dataset that
      # is not meant to be consumed; files are copied from here into it.
      - pluteus-catalog-demo:/demo:ro
      # Where a corpus's files are downloaded to and kept until they are imported, and
      # where a person drops the ones a publisher will only give a person (spec-05 §5.7).
      # A named volume because a dump runs to tens of gigabytes and is nothing to do with
      # the source tree.
      - corpora:/corpora
    stdin_open: true
    tty: true
    networks:
      - default
      - analysis

  # The interface reads the identity a reverse proxy has already established, and reads
  # it only from a request carrying a secret a browser cannot supply — so without
  # something in front of it, every rendered surface answers 401 and none can be opened.
  # This stands in for that in development and authenticates nobody: whoever reaches the
  # published port is the identity it asserts.
  #
  # Host 4101, beside the app's own 4100. Both are published on purpose: 4100 reaches the
  # household's own pages directly, and 4101 is how a surface that needs a principal is
  # opened.
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "4101:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default

  # spec-04 §8.3 and §11. The analysing sidecar holds no database credentials
  # and sits on an internal network shared only with the app, so it reaches
  # neither the database nor anything outside. It reads storage through
  # read-only mounts at the paths the app uses, and its own filesystem is
  # read-only apart from a tmpfs for scratch.
  sidecar:
    build:
      context: ./sidecar
    environment:
      ALLOWED_ROOTS: /app/storage:/app/tmp/storage
    volumes:
      - ./storage:/app/storage:ro
      - ./tmp/storage:/app/tmp/storage:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - analysis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/describe')"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  default:
  # Internal: nothing on it routes beyond the containers attached, so the
  # sidecar reaches the app and nothing else, not the host's network.
  analysis:
    internal: true

volumes:
  pgdata:
  jobsdata:
  corpusdata:
  corpora:
  deps:
  build:
  homelab-media-linuxserver-plex-music:
    external: true
  pluteus-catalog-demo:
    external: true