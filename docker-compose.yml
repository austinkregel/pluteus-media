services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # The node refuses to start when a volume holding the household's bytes is not
    # mounted, and a volume that is merely late is the ordinary case after a power cut.
    # Docker backs off between restarts of its own accord, up to a minute, so a store
    # that comes back some minutes after this host does is waited out rather than
    # needing a hand.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    # Host 4100 because 4000 is held by homelab-iab. The container still
    # serves on Phoenix's default 4000 internally.
    ports:
      - "4100:4000"
    volumes:
      - .:/app
      # deps and _build are named volumes rather than bind mounts: artifacts
      # compiled against the host's OTP and library paths are not valid inside
      # the image, and sharing one directory between the two corrupts both.
      - deps:/app/deps
      - build:/app/_build
      # The demo corpus, read-only. Acquisition moves what it takes out of the
      # inbox (spec-04 §4.3), so the inbox is never pointed at a dataset that
      # is not meant to be consumed; files are copied from here into it.
      - pluteus-catalog-demo:/demo:ro
    stdin_open: true
    tty: true
    networks:
      - default
      - analysis

  # The interface reads the identity a reverse proxy has already established, and reads
  # it only from a request carrying a secret a browser cannot supply — so without
  # something in front of it, every rendered surface answers 401 and none can be opened.
  # This stands in for that in development and authenticates nobody: whoever reaches the
  # published port is the identity it asserts.
  #
  # Host 4101, beside the app's own 4100. Both are published on purpose: 4100 reaches the
  # household's own pages directly, and 4101 is how a surface that needs a principal is
  # opened.
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "4101:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default

  # spec-04 §8.3 and §11. The analysing sidecar holds no database credentials
  # and sits on an internal network shared only with the app, so it reaches
  # neither the database nor anything outside. It reads storage through
  # read-only mounts at the paths the app uses, and its own filesystem is
  # read-only apart from a tmpfs for scratch.
  sidecar:
    build:
      context: ./sidecar
    environment:
      ALLOWED_ROOTS: /app/storage:/app/tmp/storage
    volumes:
      - ./storage:/app/storage:ro
      - ./tmp/storage:/app/tmp/storage:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - analysis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/describe')"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  default:
  # Internal: nothing on it routes beyond the containers attached, so the
  # sidecar reaches the app and nothing else, not the host's network.
  analysis:
    internal: true

volumes:
  pgdata:
  deps:
  build:
  homelab-media-linuxserver-plex-music:
    external: true
  pluteus-catalog-demo:
    external: true