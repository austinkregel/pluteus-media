# The forward-authenticating proxy, for development only.
#
# Pluteus runs no login flow. It reads the identity a reverse proxy has already
# established with the provider, and it reads those headers only from a request that also
# carries a secret the proxy injects and a browser cannot. So the interface is
# unreachable without something in front of it doing that job, which is what this does.
#
# It authenticates nobody. It asserts an identity unconditionally, which is exactly what
# must never be deployed: anything that can reach this port is whoever it says below.
# That is why it binds a development port and why the secret it injects is the
# development one.

# A request that is not an upgrade must not be told the connection is upgrading.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Who the proxy says you are. The default is below; set the cookie
# `pluteus_dev_subject` in the browser to be someone else, which is how two members can
# be held side by side — one window each — to see that a surface composed from one
# person's consumption does not show another's.
#
# An identity arriving for the first time is admitted as a member, so any address works
# and no account has to be made first.
map $cookie_pluteus_dev_subject $dev_subject {
    ""      "austin@household.test";
    default $cookie_pluteus_dev_subject;
}

server {
    listen 80;
    server_name _;

    # Docker's own resolver, so the app's address is looked up per request rather than
    # once at startup. Without it, restarting the app leaves this holding an address
    # nothing answers on until the proxy is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Large enough for the demo corpus's own files, since the bytes of a holding are
    # served through here as well.
    client_max_body_size 0;

    location / {
        set $app "app:4000";
        proxy_pass http://$app$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # What the provider would have decided. Each is set rather than added, so a
        # header a browser sent under the same name is replaced and never arrives
        # twice — which the deployment reads as no identity at all rather than as one.
        proxy_set_header X-Pluteus-Proxy-Secret "development-proxy-secret";
        proxy_set_header X-Authentik-Email $dev_subject;

        # The live socket, which authenticates its upgrade with the same headers.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A live socket stays open, and a first request can wait on the code reloader
        # compiling the whole application.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 75s;

        # Streaming a holding's bytes should not be collected in memory first.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
